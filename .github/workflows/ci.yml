name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/task/') && format('ci-task-{0}', github.ref)) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/task/')) }}

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      mode: ${{ steps.decision.outputs.mode }}
      delegated: ${{ steps.event-route.outputs.delegated }}
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Route exact-tree task push
        id: event-route
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci_event_route.py
          --output-dir "$RUNNER_TEMP/event-decision-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Upload event routing identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: event-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/event-decision-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
      - name: Classify complete comparison
        id: decision
        run: >-
          python scripts/ci_docs_gate.py classify
          --output-dir "$RUNNER_TEMP/docs-decision-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Upload routing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-decision-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  docs:
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.mode == 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check documentation and privacy
        run: >-
          python scripts/ci_docs_gate.py check
          --output-dir "$RUNNER_TEMP/docs-outcome-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Upload docs outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  quality:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || (needs.classify.outputs.mode != 'docs' && needs.classify.outputs.delegated != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Capture quality identity
        shell: bash
        run: |
          set -euo pipefail
          quality_dir="$RUNNER_TEMP/ci-quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git_status="$(git status --porcelain=v2 --branch --untracked-files=all)"
          mkdir -p "$quality_dir"
          {
            echo "# CI quality identity"
            printf '%s\n' "- event: \`$GITHUB_EVENT_NAME\`"
            printf '%s\n' "- ref: \`$GITHUB_REF\`"
            printf '%s\n' "- event SHA: \`$GITHUB_SHA\`"
            printf '%s\n' "- checked-out HEAD: \`$(git rev-parse HEAD)\`"
            printf '%s\n' "- checked-out tree: \`$(git rev-parse 'HEAD^{tree}')\`"
            printf '%s\n' "- PR base ref/SHA: \`${GITHUB_BASE_REF:-}\` / \`${PR_BASE_SHA:-}\`"
            printf '%s\n' "- PR head ref/SHA: \`${GITHUB_HEAD_REF:-}\` / \`${PR_HEAD_SHA:-}\`"
            printf '%s\n' "- workflow run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            printf '%s\n' "- manifest: \`ci/test-lanes.json\`"
            printf '%s\n' "- manifest SHA-256: \`$(sha256sum ci/test-lanes.json | cut -d ' ' -f 1)\`"
            printf '%s\n' "- lockfile SHA-256: \`$(sha256sum uv.lock | cut -d ' ' -f 1)\`"
            printf '%s\n' "- Python: \`$(python --version 2>&1)\`"
            printf '%s\n' "- uv: \`$(uv --version)\`"
            printf '%s\n' "- runner: \`$RUNNER_OS/$RUNNER_ARCH\`"
          } | tee "$quality_dir/metadata.md"
          printf '%s\n' "$git_status" > "$quality_dir/git-status.txt"
          sha256sum uv.lock > "$quality_dir/uv-lock.sha256"
      - run: uv sync --locked
      - run: uv run python -m healthcheck.db.migration_guard
      - run: uv run ruff check .
      - name: Validate partition and reconcile exact collection
        shell: bash
        run: |
          set -euo pipefail
          quality_dir="$RUNNER_TEMP/ci-quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          uv run python scripts/ci_test_lanes.py validate-manifest
          uv run python scripts/ci_test_lanes.py collect --output-dir "$quality_dir"
      - name: Capture quality failure diagnostics
        if: failure()
        shell: bash
        run: |
          quality_dir="$RUNNER_TEMP/ci-quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "# Quality failure diagnostics"
            git status --short --branch
            df -h .
            printf '%s\n' "processors: $(nproc)"
          } > "$quality_dir/failure-diagnostics.md"
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-quality-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  test:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || (needs.classify.outputs.mode != 'docs' && needs.classify.outputs.delegated != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane:
          - garmin
          - core-sleep
          - app-ingest
    env:
      LANE: ${{ matrix.lane }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Capture lane identity
        shell: bash
        run: |
          set -euo pipefail
          lane_dir="$RUNNER_TEMP/ci-lane-$LANE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git_status="$(git status --porcelain=v2 --branch --untracked-files=all)"
          selection_sha="$(python scripts/ci_test_lanes.py paths --lane "$LANE" | sha256sum | cut -d ' ' -f 1)"
          mkdir -p "$lane_dir"
          {
            echo "# CI lane identity"
            printf '%s\n' "- lane: \`$LANE\`"
            printf '%s\n' "- event: \`$GITHUB_EVENT_NAME\`"
            printf '%s\n' "- ref: \`$GITHUB_REF\`"
            printf '%s\n' "- event SHA: \`$GITHUB_SHA\`"
            printf '%s\n' "- checked-out HEAD: \`$(git rev-parse HEAD)\`"
            printf '%s\n' "- checked-out tree: \`$(git rev-parse 'HEAD^{tree}')\`"
            printf '%s\n' "- PR base ref/SHA: \`${GITHUB_BASE_REF:-}\` / \`${PR_BASE_SHA:-}\`"
            printf '%s\n' "- PR head ref/SHA: \`${GITHUB_HEAD_REF:-}\` / \`${PR_HEAD_SHA:-}\`"
            printf '%s\n' "- workflow run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            printf '%s\n' "- manifest: \`ci/test-lanes.json\`"
            printf '%s\n' "- manifest SHA-256: \`$(sha256sum ci/test-lanes.json | cut -d ' ' -f 1)\`"
            printf '%s\n' "- selection SHA-256: \`$selection_sha\`"
            printf '%s\n' "- lockfile SHA-256: \`$(sha256sum uv.lock | cut -d ' ' -f 1)\`"
            printf '%s\n' "- Python: \`$(python --version 2>&1)\`"
            printf '%s\n' "- uv: \`$(uv --version)\`"
            printf '%s\n' "- runner: \`$RUNNER_OS/$RUNNER_ARCH\`"
          } | tee "$lane_dir/metadata.md"
          printf '%s\n' "$git_status" > "$lane_dir/git-status.txt"
          sha256sum uv.lock > "$lane_dir/uv-lock.sha256"
      - run: uv sync --locked
      - name: Run serial pytest lane with timing
        env:
          HEALTHCHECK_DATA_DIR: ${{ runner.temp }}/healthcheck-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -o pipefail
          lane_dir="$RUNNER_TEMP/ci-lane-$LANE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          uv run python scripts/ci_test_lanes.py run-lane \
            --lane "$LANE" \
            --output-dir "$lane_dir" \
            --basetemp "$RUNNER_TEMP/pytest-$LANE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Verify lane execution evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          lane_dir="$RUNNER_TEMP/ci-lane-$LANE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if uv run python scripts/ci_test_lanes.py verify-lane \
              --lane "$LANE" \
              --output-dir "$lane_dir"; then
            verify_status=0
          else
            verify_status=$?
          fi
          cat "$lane_dir/metadata.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$lane_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$verify_status"
      - name: Capture lane failure diagnostics
        if: failure()
        shell: bash
        run: |
          lane_dir="$RUNNER_TEMP/ci-lane-$LANE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "# Lane failure diagnostics"
            git status --short --branch
            df -h .
            printf '%s\n' "processors: $(nproc)"
          } > "$lane_dir/failure-diagnostics.md"
      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-lane-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-lane-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  windows-smoke:
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || (needs.classify.outputs.mode != 'docs' && needs.classify.outputs.delegated != 'true')) }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run Windows process traversal regression
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File tests/test_ci_windows_process.ps1
      - name: Run workspace janitor synthetic regression (Windows PowerShell 5.1)
        shell: pwsh
        run: >-
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File tests/test_cleanup_workspaces.ps1
      - name: Run focused Windows smoke
        shell: pwsh
        env:
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}\ci-windows-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/ci_windows_smoke.ps1 -EvidenceDir "$env:SMOKE_EVIDENCE_DIR"
      - name: Upload Windows smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-windows-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\ci-windows-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  checks:
    if: ${{ always() && (needs.classify.result != 'success' || needs.classify.outputs.delegated != 'true') }}
    needs:
      - classify
      - docs
      - quality
      - test
      - windows-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Download mandatory evidence
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downloaded-evidence
          merge-multiple: false
      - name: Download current routing and docs evidence
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: docs-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downloaded-evidence
          merge-multiple: false
      - name: Fail-closed final verdict
        if: always()
        env:
          CI_MODE: ${{ needs.classify.outputs.mode }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.windows-smoke.result }}
          EXPECTED_EVENT_NAME: ${{ github.event_name }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_PR_BASE_REF: ${{ github.base_ref }}
          EXPECTED_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_PR_HEAD_REF: ${{ github.head_ref }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -uo pipefail
          evidence_root="$RUNNER_TEMP/downloaded-evidence"
          route="$(python scripts/ci_docs_gate.py route --artifacts-root "$evidence_root")" || exit 1
          if [ "$route" = docs ]; then
            echo "checks PASS: docs-only; pytest and Windows were not run" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$route" = full ] || exit 1
          # Full-rerun-only: no fallback to evidence from earlier attempts.
          python scripts/ci_test_lanes.py verify-attempt \
            --artifacts-root "$evidence_root" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          attempt_status=$?
          python scripts/ci_test_lanes.py gate \
            --artifacts-root "$evidence_root" \
            --quality-result "$QUALITY_RESULT" \
            --test-result "$TEST_RESULT" \
            --head-sha "$(git rev-parse HEAD)" \
            --tree-sha "$(git rev-parse 'HEAD^{tree}')" \
            --event-name "$EXPECTED_EVENT_NAME" \
            --ref "$EXPECTED_REF" \
            --pr-base-ref "$EXPECTED_PR_BASE_REF" \
            --pr-base-sha "$EXPECTED_PR_BASE_SHA" \
            --pr-head-ref "$EXPECTED_PR_HEAD_REF" \
            --pr-head-sha "$EXPECTED_PR_HEAD_SHA" \
            --expected-platform linux
          linux_status=$?
          python scripts/ci_windows_smoke.py \
            --artifacts-root "$evidence_root" \
            --job-result "$WINDOWS_RESULT" \
            --head-sha "$(git rev-parse HEAD)" \
            --tree-sha "$(git rev-parse 'HEAD^{tree}')" \
            --event-name "$EXPECTED_EVENT_NAME" \
            --ref "$EXPECTED_REF" \
            --pr-base-ref "$EXPECTED_PR_BASE_REF" \
            --pr-base-sha "$EXPECTED_PR_BASE_SHA" \
            --pr-head-ref "$EXPECTED_PR_HEAD_REF" \
            --pr-head-sha "$EXPECTED_PR_HEAD_SHA"
          windows_status=$?
          if [ "$attempt_status" -ne 0 ] || [ "$linux_status" -ne 0 ] || [ "$windows_status" -ne 0 ]; then
            exit 1
          fi
