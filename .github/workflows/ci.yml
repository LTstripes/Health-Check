name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/task/') && format('ci-task-{0}', github.ref)) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/task/')) }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Capture quality identity
        shell: bash
        run: |
          set -euo pipefail
          quality_dir="$RUNNER_TEMP/ci-quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git_status="$(git status --porcelain=v2 --branch --untracked-files=all)"
          mkdir -p "$quality_dir"
          {
            echo "# CI quality identity"
            printf '%s\n' "- event: \`$GITHUB_EVENT_NAME\`"
            printf '%s\n' "- ref: \`$GITHUB_REF\`"
            printf '%s\n' "- event SHA: \`$GITHUB_SHA\`"
            printf '%s\n' "- checked-out HEAD: \`$(git rev-parse HEAD)\`"
            printf '%s\n' "- checked-out tree: \`$(git rev-parse 'HEAD^{tree}')\`"
            printf '%s\n' "- PR base ref/SHA: \`${GITHUB_BASE_REF:-}\` / \`${PR_BASE_SHA:-}\`"
            printf '%s\n' "- PR head ref/SHA: \`${GITHUB_HEAD_REF:-}\` / \`${PR_HEAD_SHA:-}\`"
            printf '%s\n' "- workflow run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            printf '%s\n' "- manifest: \`ci/test-lanes.json\`"
            printf '%s\n' "- manifest SHA-256: \`$(sha256sum ci/test-lanes.json | cut -d ' ' -f 1)\`"
            printf '%s\n' "- lockfile SHA-256: \`$(sha256sum uv.lock | cut -d ' ' -f 1)\`"
            printf '%s\n' "- Python: \`$(python --version 2>&1)\`"
            printf '%s\n' "- uv: \`$(uv --version)\`"
            printf '%s\n' "- runner: \`$RUNNER_OS/$RUNNER_ARCH\`"
          } | tee "$quality_dir/metadata.md"
          printf '%s\n' "$git_status" > "$quality_dir/git-status.txt"
          sha256sum uv.lock > "$quality_dir/uv-lock.sha256"
      - run: uv sync --locked
      - run: uv run python -m healthcheck.db.migration_guard
      - run: uv run ruff check .
      - name: Validate partition and reconcile exact collection
        shell: bash
        run: |
          set -euo pipefail
          quality_dir="$RUNNER_TEMP/ci-quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          uv run python scripts/ci_test_lanes.py validate-manifest
          uv run python scripts/ci_test_lanes.py collect --output-dir "$quality_dir"
      - name: Capture quality failure diagnostics
        if: failure()
        shell: bash
        run: |
          quality_dir="$RUNNER_TEMP/ci-quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "# Quality failure diagnostics"
            git status --short --branch
            df -h .
            printf '%s\n' "processors: $(nproc)"
          } > "$quality_dir/failure-diagnostics.md"
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-quality-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane:
          - garmin
          - core-sleep
          - app-ingest
    env:
      LANE: ${{ matrix.lane }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Capture lane identity
        shell: bash
        run: |
          set -euo pipefail
          lane_dir="$RUNNER_TEMP/ci-lane-$LANE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git_status="$(git status --porcelain=v2 --branch --untracked-files=all)"
          selection_sha="$(python scripts/ci_test_lanes.py paths --lane "$LANE" | sha256sum | cut -d ' ' -f 1)"
          mkdir -p "$lane_dir"
          {
            echo "# CI lane identity"
            printf '%s\n' "- lane: \`$LANE\`"
            printf '%s\n' "- event: \`$GITHUB_EVENT_NAME\`"
            printf '%s\n' "- ref: \`$GITHUB_REF\`"
            printf '%s\n' "- event SHA: \`$GITHUB_SHA\`"
            printf '%s\n' "- checked-out HEAD: \`$(git rev-parse HEAD)\`"
            printf '%s\n' "- checked-out tree: \`$(git rev-parse 'HEAD^{tree}')\`"
            printf '%s\n' "- PR base ref/SHA: \`${GITHUB_BASE_REF:-}\` / \`${PR_BASE_SHA:-}\`"
            printf '%s\n' "- PR head ref/SHA: \`${GITHUB_HEAD_REF:-}\` / \`${PR_HEAD_SHA:-}\`"
            printf '%s\n' "- workflow run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            printf '%s\n' "- manifest: \`ci/test-lanes.json\`"
            printf '%s\n' "- manifest SHA-256: \`$(sha256sum ci/test-lanes.json | cut -d ' ' -f 1)\`"
            printf '%s\n' "- selection SHA-256: \`$selection_sha\`"
            printf '%s\n' "- lockfile SHA-256: \`$(sha256sum uv.lock | cut -d ' ' -f 1)\`"
            printf '%s\n' "- Python: \`$(python --version 2>&1)\`"
            printf '%s\n' "- uv: \`$(uv --version)\`"
            printf '%s\n' "- runner: \`$RUNNER_OS/$RUNNER_ARCH\`"
          } | tee "$lane_dir/metadata.md"
          printf '%s\n' "$git_status" > "$lane_dir/git-status.txt"
          sha256sum uv.lock > "$lane_dir/uv-lock.sha256"
      - run: uv sync --locked
      - name: Run serial pytest lane with timing
        env:
          HEALTHCHECK_DATA_DIR: ${{ runner.temp }}/healthcheck-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -o pipefail
          lane_dir="$RUNNER_TEMP/ci-lane-$LANE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          uv run python scripts/ci_test_lanes.py run-lane \
            --lane "$LANE" \
            --output-dir "$lane_dir" \
            --basetemp "$RUNNER_TEMP/pytest-$LANE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Verify lane execution evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          lane_dir="$RUNNER_TEMP/ci-lane-$LANE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if uv run python scripts/ci_test_lanes.py verify-lane \
              --lane "$LANE" \
              --output-dir "$lane_dir"; then
            verify_status=0
          else
            verify_status=$?
          fi
          cat "$lane_dir/metadata.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$lane_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$verify_status"
      - name: Capture lane failure diagnostics
        if: failure()
        shell: bash
        run: |
          lane_dir="$RUNNER_TEMP/ci-lane-$LANE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "# Lane failure diagnostics"
            git status --short --branch
            df -h .
            printf '%s\n' "processors: $(nproc)"
          } > "$lane_dir/failure-diagnostics.md"
      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-lane-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-lane-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  checks:
    if: always()
    needs:
      - quality
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download mandatory evidence
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: ci-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloaded-evidence
          merge-multiple: false
      - name: Fail-closed final verdict
        if: always()
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci_test_lanes.py gate \
            --artifacts-root downloaded-evidence \
            --quality-result "$QUALITY_RESULT" \
            --test-result "$TEST_RESULT" \
            --head-sha "$(git rev-parse HEAD)" \
            --tree-sha "$(git rev-parse 'HEAD^{tree}')"
