name: CI

on:
  push:
    # Task candidates are tested by their mandatory exact PR gate.
    branches-ignore:
      - "task/**"
    tags:
      - "**"
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import os
          import subprocess

          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          docs_only = False
          if base and base.strip("0"):
              diff = subprocess.run(
                  ["git", "diff", "--no-renames", "--name-only", "-z", f"{base}...{head}"],
                  capture_output=True, check=False,
              )
              paths = diff.stdout.split(b"\0")[:-1]
              # README.md is build metadata (project.readme in pyproject.toml).
              docs_only = diff.returncode == 0 and bool(paths) and all(
                  path == b"AGENTS.md" or (path.startswith(b"docs/") and path.endswith(b".md"))
                  for path in paths
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"docs_only={str(docs_only).lower()}\n")

  quality:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Migration guard
        run: uv run --locked python -m healthcheck.db.migration_guard
        env:
          HEALTHCHECK_DATA_DIR: ${{ runner.temp }}/healthcheck-ci
      - run: uv run --locked ruff check .

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Full test suite
        run: uv run --locked pytest -n auto --durations=30
        env:
          HEALTHCHECK_DATA_DIR: ${{ runner.temp }}/healthcheck-ci

  windows-smoke:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Windows-sensitive product tests (including native DPAPI)
        env:
          HEALTHCHECK_DATA_DIR: ${{ runner.temp }}/healthcheck-ci
        run: >-
          uv run --locked pytest tests/test_bootstrap.py tests/test_demo_tooling.py
          tests/test_garmin_auth.py tests/test_google_protection.py tests/test_timezone_runtime.py
      - name: Workspace cleanup and relocation regressions (Windows PowerShell 5.1)
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/test_cleanup_workspaces.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/test_workspace_retirement.ps1
          exit $LASTEXITCODE
      - name: Synthetic CLI and loopback smoke
        env:
          HEALTHCHECK_DATA_DIR: ${{ runner.temp }}/healthcheck-ci
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked healthcheck seed-demo
          uv run --locked healthcheck prepare-runtime
          uv run --locked python - <<'PY'
          import subprocess
          import sys
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          command = [sys.executable, "-m", "healthcheck.cli"]
          servers = []
          try:
              for app, port in (("ui", "8120"), ("ingest", "8121")):
                  server = subprocess.Popen(command + ["serve", "--app", app, "--port", port])
                  servers.append(server)
                  deadline = time.monotonic() + 45
                  while True:
                      if server.poll() is not None:
                          raise RuntimeError(f"{app} exited before becoming ready")
                      try:
                          with urlopen(f"http://127.0.0.1:{port}/healthz", timeout=1) as response:
                              if response.status == 200:
                                  break
                      except (URLError, TimeoutError):
                          pass
                      if time.monotonic() >= deadline:
                          raise TimeoutError(f"{app} startup timed out")
                      time.sleep(0.25)
              subprocess.run(command + ["smoke", "--ingest-url", "http://127.0.0.1:8121"], check=True)
          finally:
              for server in servers:
                  if server.poll() is None:
                      server.terminate()
                  server.wait(timeout=10)
          PY

  checks:
    if: ${{ always() }}
    needs: [changes, quality, test, windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os

          needs = json.loads(os.environ["NEEDS"])
          assert needs["changes"]["result"] == "success", needs
          docs_only = needs["changes"]["outputs"].get("docs_only") == "true"
          expected = "skipped" if docs_only else "success"
          for job in ("quality", "test", "windows-smoke"):
              assert needs[job]["result"] == expected, f"{job}: {needs[job]['result']}"
          print("checks PASS: docs-only; product checks skipped" if docs_only else "checks PASS")
