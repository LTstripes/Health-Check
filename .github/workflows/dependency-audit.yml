name: Dependency audit

on:
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - scripts/dependency_audit.py
      - tests/test_dependency_audit.py
      - .github/workflows/dependency-audit.yml
      - .github/dependabot.yml
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - scripts/dependency_audit.py
      - tests/test_dependency_audit.py
      - .github/workflows/dependency-audit.yml
      - .github/dependabot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Audit locked dependency advisories
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dependency_audit.py \
            --output-dir "$RUNNER_TEMP/dependency-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
