name: Dependency audit

on:
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - scripts/dependency_audit.py
      - tests/test_dependency_audit.py
      - .github/workflows/dependency-audit.yml
      - .github/dependabot.yml
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - scripts/dependency_audit.py
      - tests/test_dependency_audit.py
      - .github/workflows/dependency-audit.yml
      - .github/dependabot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Audit locked dependency advisories
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dependency_audit.py \
            --output-dir "$RUNNER_TEMP/dependency-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
