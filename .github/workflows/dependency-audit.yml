name: Dependency audit

on:
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - scripts/dependency_audit.py
      - tests/test_dependency_audit.py
      - .github/workflows/dependency-audit.yml
      - .github/dependabot.yml
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - scripts/dependency_audit.py
      - tests/test_dependency_audit.py
      - .github/workflows/dependency-audit.yml
      - .github/dependabot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Audit locked dependency advisories
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dependency_audit.py \
            --output-dir "$RUNNER_TEMP/dependency-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
