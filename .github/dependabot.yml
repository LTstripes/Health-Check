version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # The accepted Garmin source pin requires a separately assigned update.
      - dependency-name: garminconnect
    groups:
      registry-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["garminconnect"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
