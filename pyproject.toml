[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "health-check"
version = "0.1.0"
description = "Local-first Health-Check runtime"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "alembic>=1.20.1,<2",
    "cryptography>=50.0,<51",
    "fastapi>=0.162.0,<1",
    "garminconnect @ git+https://github.com/cyberjunky/python-garminconnect.git@3eee7a4db6c2242967aae1780b8839599ea7dcbb",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.16.2,<3",
    "python-multipart>=0.0.33,<1",
    "sqlalchemy>=2.1.8,<3",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0,<1",
]

[project.scripts]
healthcheck = "healthcheck.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=9.2.0,<10",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.17.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/healthcheck"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Security floors for runtime transitive dependencies; keep compatible major versions.
constraint-dependencies = [
    "certifi>=2026.10.19",
    "mako>=1.4.2,<2",
    "urllib3>=2.8.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
# The former `python -m pytest` lane wrapper also exposed repository helper scripts.
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
