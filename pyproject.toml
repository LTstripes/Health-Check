[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "health-check"
version = "0.1.0"
description = "Local-first Health-Check runtime"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
healthcheck = "healthcheck.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/healthcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
