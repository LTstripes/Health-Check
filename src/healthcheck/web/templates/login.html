<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Health-Check</title>
  <style>
    body{font:18px system-ui,sans-serif;background:#f6f2e9;color:#292d27;margin:0}
    main{max-width:25rem;margin:12vh auto;padding:2rem;background:#fdfbf6;border:1px solid #dcdccc;border-radius:12px}
    h1{font-size:2rem} label,input,button{display:block} input{box-sizing:border-box;width:100%;margin:0.5rem 0 1.5rem;padding:0.7rem;font:inherit}
    button{padding:0.7rem 1.4rem;background:#31584b;color:white;border:0;border-radius:5px;font:inherit}
  </style>
</head>
<body><main>
  <p>Health-Check · домашний сервер</p>
  <h1>Вход</h1>
  <p>Введите пароль владельца, настроенный на сервере.</p>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" minlength="12" maxlength="1024" autofocus>
    <button type="submit">Войти</button>
  </form>
</main></body>
</html>
