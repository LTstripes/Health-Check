<section class="card sleep-schedule" aria-labelledby="sleep-schedule-title">
  <h2 id="sleep-schedule-title">Когда я спал</h2>
  <p class="muted">Местное время каждой ночи · дата пробуждения. Garmin — верхняя полоса, Google — нижняя. Источники переключаются над графиком длительности.</p>
  <div id="sleep-schedule"><p class="muted">Для расписания нужен JavaScript. Сохранённые состояния доступны в таблице длительности выше.</p></div>
</section>
<style>
.sleep-schedule { --schedule-label: 72px; }
.sleep-schedule-axis, .sleep-schedule-row { display: grid; grid-template-columns: var(--schedule-label) minmax(0, 1fr); gap: 8px; }
.sleep-schedule-axis { height: 24px; color: var(--muted); font-size: 10px; }
.sleep-schedule-clock, .sleep-schedule-track { position: relative; }
.sleep-schedule-tick { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.sleep-schedule-tick:first-child { transform: none; }
.sleep-schedule-tick:last-child { transform: translateX(-100%); }
.sleep-schedule-row { min-height: 22px; }
.sleep-schedule-compact .sleep-schedule-row { min-height: 14px; }
.sleep-schedule-date { color: var(--muted); font-size: 10px; line-height: 14px; white-space: nowrap; }
.sleep-schedule-track { border-bottom: 1px solid var(--line); min-height: 14px; }
.sleep-schedule-grid { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); pointer-events: none; }
.sleep-schedule-bar { position: absolute; height: 5px; min-height: 0; min-width: 1px; padding: 0; border: 0; border-radius: 2px; cursor: help; }
.sleep-schedule-bar:hover, .sleep-schedule-bar:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; z-index: 2; }
.sleep-schedule-note { position: absolute; left: 2px; color: var(--muted); font-size: 9px; line-height: 7px; white-space: nowrap; max-width: calc(100% - 4px); overflow: hidden; text-overflow: ellipsis; }
.sleep-schedule-empty { color: var(--muted); font-size: 10px; line-height: 14px; position: relative; }
.sleep-schedule-divider { border-top: 1px solid var(--line-strong); color: var(--muted); font-size: 10px; padding: 2px 0; overflow-wrap: anywhere; }
.sleep-schedule-summary { margin: 4px 0 8px; font-size: 12px; }
.sleep-schedule-detail { min-height: 1.5em; font-size: 12px; margin: 6px 0; }
@media (max-width: 480px) { .sleep-schedule { --schedule-label: 58px; } .sleep-schedule-axis { font-size: 8px; } }
</style>
<script src="/static/sleep_schedule.js" defer></script>
