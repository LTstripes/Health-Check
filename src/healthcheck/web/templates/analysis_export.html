<section class="card analysis-export" id="analysis-export" aria-labelledby="analysis-export-heading">
  <h2 id="analysis-export-heading">Скачать данные</h2>
  <p>Сохранённые показатели и ваши комментарии в одном локальном файле.</p>
  <p id="analysis-export-preview" aria-live="polite">Период: {{ export_start_date }} — {{ export_end_date }} (включительно).</p>
  <form id="analysis-export-form" class="inline-edit owner-controls">
    <label>Период <select name="days"><option value="7"{% if export_days == 7 %} selected{% endif %}>7 дней</option><option value="30"{% if export_days == 30 %} selected{% endif %}>30 дней</option></select></label>
    <label>По дату включительно <input type="date" name="end_date" value="{{ export_end_date }}" max="9999-12-30" required></label>
    <button type="submit" disabled>Скачать</button>
    <details class="owner-info export-source-options" id="analysis-export-options" hidden>
      <summary>Выбрать источник</summary>
      <label data-export-garmin-choice hidden>Источник Garmin
        <select name="garmin_source_id" required disabled><option value="">Загрузка источников…</option></select>
      </label>
      <input type="hidden" name="steps_view" value="completed">
      <label data-export-google-choice hidden>Google HRV <select name="google_hrv_source_id" disabled><option value="">Не включать</option></select></label>
    </details>
    <button type="button" id="analysis-export-reload" hidden>Повторить загрузку источников</button>
  </form>
  <noscript>Для скачивания включите JavaScript в этом локальном интерфейсе.</noscript>
  <p id="analysis-export-status" role="status" aria-live="polite">Проверяем сохранённые источники…</p>
  <div id="analysis-export-result" hidden>
    <p id="analysis-export-range"></p>
    <details class="owner-info">
      <summary><span aria-hidden="true">ⓘ</span> JSON и подробности</summary>
      <p><a id="analysis-export-text" class="button-link" download>Скачать текст ещё раз</a> <a id="analysis-export-json" class="button-link" download>Скачать JSON</a></p>
      <p id="analysis-export-sizes" class="muted"></p>
      <ul id="analysis-export-summary" aria-label="Наличие сохранённых данных"></ul>
      <pre id="analysis-export-disclosures"></pre>
    </details>
  </div>
</section>
