<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Health-Check{% endblock %}</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Health-Check</a>
    <nav>
      <a href="/" class="{% if page == 'dashboard' %}active{% endif %}">Weight dashboard</a>
      <a href="/garmin" class="{% if page == 'garmin' %}active{% endif %}">Garmin dashboard</a>
      <a href="/agreement" class="{% if page == 'agreement' %}active{% endif %}">Sleep agreement</a>
      <a href="/brief" class="{% if page == 'brief' %}active{% endif %}">Period Brief</a>
      <a href="/imports" class="{% if page == 'imports' %}active{% endif %}">Import review</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="legal">
    Local loopback UI. Consumer BIA is non-clinical. No diagnosis or causal claims.
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
